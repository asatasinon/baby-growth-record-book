[project]
name = "baby-growth-worker"
version = "0.1.0"
description = "Background worker for baby growth platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic-settings>=2.6.0",
  "python-json-logger>=2.0.7",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.1",
  "boto3>=1.35.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.8"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
