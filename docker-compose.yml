services:
  postgres:
    image: postgres:16
    container_name: baby-growth-postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/specs/S02-db-schema.sql:/docker-entrypoint-initdb.d/S02-db-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: baby-growth-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    container_name: baby-growth-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/baby-growth
      "

  api:
    build:
      context: ./backend
    container_name: baby-growth-api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./worker
    container_name: baby-growth-worker
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  h5:
    image: nginx:1.27-alpine
    container_name: baby-growth-h5
    volumes:
      - ./frontend/miniapp/nginx.h5.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/miniapp/dist:/usr/share/nginx/html:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: baby-growth-nginx
    depends_on:
      - api
      - h5
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  minio_data:
